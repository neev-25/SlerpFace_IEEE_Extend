# Production NGINX Reverse Proxy configuration for GuardFace
# Terminates TLS, injects standard security headers, and routes static assets.

server {
    listen 80;
    server_name localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name localhost;

    # SSL Certificates
    ssl_certificate /etc/ssl/certs/guardface.crt;
    ssl_certificate_key /etc/ssl/private/guardface.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers (BUG-05 remediation)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: ws: wss:;" always;

    # Client body limit aligned with app (20MB)
    client_max_body_size 20M;

    # Direct robots.txt & sitemap.xml routing
    location = /robots.txt {
        alias /path/to/AI_Project/static/robots.txt;
    }

    location = /sitemap.xml {
        alias /path/to/AI_Project/static/sitemap.xml;
    }

    # Streamlit WebSockets and SPA proxy
    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

